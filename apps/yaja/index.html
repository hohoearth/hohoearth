<!doctype html>
<html lang="ko" data-app="yaja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>야자 감독 배정</title>
<link rel="icon" href="img/school-logo.jpg">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <img class="logo" src="img/school-logo.jpg" alt="학교 마크">
    <div>
      <div class="school">충북대학교사범대학부설고등학교 <span class="pill-badge">야자 감독 배정</span></div>
      <div class="sub">야간자율학습 감독 배정 · 공유 시스템</div>
    </div>
  </div>
  <div class="top-actions">
    <button class="accent" data-act="y-export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>엑셀로 내보내기</button>
    <button data-act="go-cloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>온라인 공유</button>
  </div>
</header>
<nav id="tabs" class="tabbar">
  <button data-tab="yaja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>야자 감독 배정</button>
  <button data-tab="backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>백업 · 복원</button>
</nav>
<main id="app"></main>
<footer class="credit">만든이: 충북사대부고 교사 김호연</footer>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script src="js/teacher-import.js"></script>
<script src="js/yaja.js"></script>
<script src="js/main.js"></script>
</body>
</html>
