<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도플러 효과 시뮬레이션</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (브라우저 내 JSX 컴파일) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Lucide 아이콘 인라인 SVG 컴포넌트 ---
    const Icon = ({ children, size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Play = (p) => <Icon {...p}><polygon points="5 3 19 12 5 21 5 3"/></Icon>;
    const Pause = (p) => <Icon {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></Icon>;
    const RotateCcw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></Icon>;
    const AmbulanceIcon = (p) => <Icon {...p}><rect x="3" y="5" width="14" height="10" rx="2"/><path d="M17 9h4l1 3v3h-5"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M10 9h4m-2-2v4"/></Icon>;
    const Sparkles = (p) => <Icon {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></Icon>;
    const Maximize = (p) => <Icon {...p}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></Icon>;
    const Minimize = (p) => <Icon {...p}><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></Icon>;
    const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6"/></Icon>;
    const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"/></Icon>;
    const BookOpen = (p) => <Icon {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></Icon>;
    const Eye = (p) => <Icon {...p}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></Icon>;
    const Activity = (p) => <Icon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Icon>;

    // 교과서 스타일 분수 컴포넌트
    const Frac = ({ top, bot }) => (
      <span className="inline-flex flex-col items-center justify-center align-middle mx-1 text-[0.88em] leading-none">
        <span className="border-b border-current pb-0.5 px-1 font-mono">{top}</span>
        <span className="pt-0.5 px-1 font-mono">{bot}</span>
      </span>
    );

    function DopplerSimulationApp() {
      // --- 모드 관리: 'galaxy' (은하-빛) | 'ambulance' (구급차-소리) ---
      const [mode, setMode] = useState('galaxy');
      const [isPlaying, setIsPlaying] = useState(false);
      const [isFullscreen, setIsFullscreen] = useState(false);

      // --- 물리 상태 변수 ---
      // 1. 은하 모드 (광속 단위: 300,000 km/s, 은하 속도: km/s)
      const [cSpeed] = useState(300000); // 광속 (km/s)
      // (+) 후퇴(멀어짐, 적색편이), (-) 접근(가까워짐, 청색편이)
      const [galaxySpeed, setGalaxySpeed] = useState(45000); 
      const [galaxyRestLambda, setGalaxyRestLambda] = useState(656.3); // H-알파 기준 파장 (nm)

      // 2. 구급차 모드 (음속 단위: 340 m/s, 구급차 속도: m/s)
      const [soundSpeed, setSoundSpeed] = useState(340); // 음속 (m/s)
      // (+) 멀어짐, (-) 접근
      const [ambulanceSpeed, setAmbulanceSpeed] = useState(68); 
      const [restFreq, setRestFreq] = useState(440); // 원래 소리 진동수 (Hz)

      // 파원과 관찰자 초기 거리 (px)
      const [initialDistance, setInitialDistance] = useState(600); // 300 ~ 1200

      // 카메라 시점 (free: 3D 자유 회전, observer: 관찰자 시점, top: 조감도)
      const [cameraMode, setCameraMode] = useState('free');

      // 공식 단계별 해설 (1 ~ 5)
      const [formulaStep, setFormulaStep] = useState(1);
      const [isAutoPlayingFormula, setIsAutoPlayingFormula] = useState(false);
      const totalSteps = 5;

      // 실시간 진동수 및 파장 그래프 데이터 (최근 50개 포인트)
      const [freqHistory, setFreqHistory] = useState(Array(50).fill(1));
      const [lambdaHistory, setLambdaHistory] = useState(Array(50).fill(1));

      // --- Refs ---
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const sourceMeshRef = useRef(null); // 빨간색 구 (파원)
      const obsMeshRef = useRef(null);    // 파란색 구 (관찰자)
      const wavesRef = useRef([]);        // 림 셰이더 구면 파면 메쉬 배열
      const timeSinceLastWaveRef = useRef(0);
      const sourceLabelRef = useRef(null);
      const obsLabelRef = useRef(null);

      // 물리 시뮬레이션 내부 좌표: 관찰자는 x=0 (기준), 파원은 x=initialDistance 에서 시작
      const simPosRef = useRef({
        obsX: 0,
        sourceX: 600,
        needsReset: false
      });

      // 최신 상태 동기화 Ref
      const stateRef = useRef({
        mode,
        isPlaying,
        galaxySpeed,
        cSpeed,
        galaxyRestLambda,
        soundSpeed,
        ambulanceSpeed,
        restFreq,
        initialDistance,
        cameraMode
      });

      useEffect(() => {
        stateRef.current = {
          mode,
          isPlaying,
          galaxySpeed,
          cSpeed,
          galaxyRestLambda,
          soundSpeed,
          ambulanceSpeed,
          restFreq,
          initialDistance,
          cameraMode
        };
      }, [mode, isPlaying, galaxySpeed, cSpeed, galaxyRestLambda, soundSpeed, ambulanceSpeed, restFreq, initialDistance, cameraMode]);

      // --- 공식 천천히 자동 재생 타이머 (4초 주기) ---
      useEffect(() => {
        let timer;
        if (isAutoPlayingFormula) {
          timer = setInterval(() => {
            setFormulaStep(prev => (prev >= totalSteps ? 1 : prev + 1));
          }, 4000);
        }
        return () => clearInterval(timer);
      }, [isAutoPlayingFormula]);

      // --- 위치 초기화 핸들러 ---
      const resetPositions = (curMode = mode, dist = initialDistance) => {
        simPosRef.current.obsX = 0;
        simPosRef.current.sourceX = dist;
        timeSinceLastWaveRef.current = 0;

        if (sceneRef.current) {
          wavesRef.current.forEach(w => {
            sceneRef.current.remove(w.mesh);
            w.mesh.geometry.dispose();
            w.mesh.material.dispose();
          });
        }
        wavesRef.current = [];
        setFreqHistory(Array(50).fill(1));
        setLambdaHistory(Array(50).fill(1));
      };

      const handleModeChange = (newMode) => {
        setMode(newMode);
        resetPositions(newMode, initialDistance);
      };

      const handleDistanceChange = (dist) => {
        setInitialDistance(dist);
        resetPositions(mode, dist);
      };

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => setIsFullscreen(true)).catch(() => {});
        } else {
          document.exitFullscreen().then(() => setIsFullscreen(false)).catch(() => {});
        }
      };

      // --- 핵심 물리 계산 (지구과학 I 비상대론적 근사: v << c) ---
      let calc = {
        vRel: 0,
        waveV: 0,
        lambda0: 0,
        lambdaObs: 0,
        deltaLambda: 0,
        f0: 0,
        fObs: 0,
        z: 0,
        shiftType: 'none', // 'red' | 'blue' | 'none'
        vPercentC: 0
      };

      if (mode === 'galaxy') {
        calc.waveV = cSpeed; // 300,000 km/s
        calc.vRel = galaxySpeed; // (+) 멀어짐(후퇴), (-) 가까워짐(접근)
        calc.lambda0 = galaxyRestLambda; // nm
        calc.f0 = (cSpeed * 1e12) / calc.lambda0; // Hz
        calc.vPercentC = (calc.vRel / cSpeed) * 100;

        // 비상대론적 공식: z = v / c = Δλ / λ0
        calc.z = calc.vRel / cSpeed;
        calc.deltaLambda = calc.lambda0 * calc.z;
        calc.lambdaObs = calc.lambda0 + calc.deltaLambda;
        calc.fObs = calc.z !== -1 ? calc.f0 / (1 + calc.z) : 0;

        if (calc.deltaLambda > 0.05) calc.shiftType = 'red';
        else if (calc.deltaLambda < -0.05) calc.shiftType = 'blue';
      } else {
        // 구급차 모드
        calc.waveV = soundSpeed; // 340 m/s
        calc.vRel = ambulanceSpeed; // (+) 멀어짐, (-) 가까워짐
        calc.f0 = restFreq; // Hz
        calc.lambda0 = soundSpeed / restFreq; // m

        // 음파 도플러: f' = f0 * (v / (v + vRel)) [vRel > 0 멀어질 때 f' 감소, vRel < 0 접근할 때 f' 증가]
        const denom = soundSpeed + ambulanceSpeed;
        if (denom <= 0) {
          calc.fObs = Infinity;
        } else {
          calc.fObs = calc.f0 * (soundSpeed / denom);
        }
        calc.lambdaObs = calc.fObs > 0 && calc.fObs !== Infinity ? soundSpeed / calc.fObs : 0;
        calc.deltaLambda = calc.lambdaObs - calc.lambda0;
        calc.z = calc.lambda0 > 0 ? calc.deltaLambda / calc.lambda0 : 0;

        if (calc.deltaLambda > 0.001) calc.shiftType = 'red';
        else if (calc.deltaLambda < -0.001) calc.shiftType = 'blue';
      }

      // 실시간 진동수 및 파장 그래프 데이터 주기적 기록 (0.1초 간격)
      useEffect(() => {
        const graphInterval = setInterval(() => {
          if (stateRef.current.isPlaying) {
            setFreqHistory(prev => {
              const next = [...prev, calc.fObs];
              if (next.length > 50) next.shift();
              return next;
            });
            setLambdaHistory(prev => {
              const next = [...prev, calc.lambdaObs];
              if (next.length > 50) next.shift();
              return next;
            });
          }
        }, 100);
        return () => clearInterval(graphInterval);
      }, [calc.fObs, calc.lambdaObs]);

      // 진동수 실시간 SVG 그래프 포인트 계산 (기준선 ratio=1.0 -> y=50)
      const renderFreqPoints = () => {
        if (!calc.f0 || calc.f0 === 0) return "";
        return freqHistory.map((val, i) => {
          const safeVal = isNaN(val) || val === Infinity ? calc.f0 * 1.5 : val;
          const ratio = safeVal / calc.f0;
          const y = 50 - (ratio - 1.0) * 120;
          const clampedY = Math.max(5, Math.min(95, y));
          const x = (i / 49) * 100;
          return `${x.toFixed(1)},${clampedY.toFixed(1)}`;
        }).join(' ');
      };

      // 파장 실시간 SVG 그래프 포인트 계산 (기준선 ratio=1.0 -> y=50)
      const renderLambdaPoints = () => {
        if (!calc.lambda0 || calc.lambda0 === 0) return "";
        return lambdaHistory.map((val, i) => {
          const safeVal = isNaN(val) ? calc.lambda0 : val;
          const ratio = safeVal / calc.lambda0;
          const y = 50 - (ratio - 1.0) * 120;
          const clampedY = Math.max(5, Math.min(95, y));
          const x = (i / 49) * 100;
          return `${x.toFixed(1)},${clampedY.toFixed(1)}`;
        }).join(' ');
      };

      // --- Three.js 3D 환경 구축 ---
      useEffect(() => {
        if (!mountRef.current) return;
        const width = mountRef.current.clientWidth;
        const height = mountRef.current.clientHeight;

        const scene = new THREE.Scene();
        sceneRef.current = scene;
        scene.background = new THREE.Color(0x020617); // 깊은 우주 다크 배경

        const camera = new THREE.PerspectiveCamera(45, width / height, 1, 20000);
        cameraRef.current = camera;
        camera.position.set(300, 450, 1100);
        camera.lookAt(300, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        rendererRef.current = renderer;
        mountRef.current.innerHTML = '';
        mountRef.current.appendChild(renderer.domElement);

        // 3D 공간 그리드 헬퍼 & 축선
        const grid = new THREE.GridHelper(5000, 100, 0x1e293b, 0x0f172a);
        grid.position.y = -35;
        scene.add(grid);

        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-4000, 0, 0), new THREE.Vector3(4000, 0, 0)
        ]);
        const centerLine = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x334155 }));
        scene.add(centerLine);

        // 1. 관찰자(Observer, 지구): 기존처럼 파란색 구로 표현
        const obsGeo = new THREE.SphereGeometry(20, 32, 32);
        const obsMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6 }); // 파란색 구
        const obsMesh = new THREE.Mesh(obsGeo, obsMat);
        obsMesh.position.set(0, 0, 0);
        scene.add(obsMesh);
        obsMeshRef.current = obsMesh;

        // 2. 파원(Source, 은하/구급차): 기존처럼 빨간색 구로 표현
        const sourceGeo = new THREE.SphereGeometry(20, 32, 32);
        const sourceMat = new THREE.MeshBasicMaterial({ color: 0xef4444 }); // 빨간색 구
        const sourceMesh = new THREE.Mesh(sourceGeo, sourceMat);
        sourceMesh.position.set(600, 0, 0);
        scene.add(sourceMesh);
        sourceMeshRef.current = sourceMesh;

        // 기본 구면 파면 지오메트리 (마루선 림 셰이더용)
        const baseSphereGeo = new THREE.SphereGeometry(1, 64, 64);

        // 마우스 3D 회전 제어 변수
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        let camTheta = Math.PI / 2.2;
        let camPhi = Math.PI / 3.4;
        let camRadius = 1300;

        const onMouseDown = (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; };
        const onMouseMove = (e) => {
          if (!isDragging || stateRef.current.cameraMode !== 'free') return;
          camTheta -= (e.clientX - prevMouse.x) * 0.005;
          camPhi = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, camPhi - (e.clientY - prevMouse.y) * 0.005));
          prevMouse = { x: e.clientX, y: e.clientY };
        };
        const onMouseUp = () => { isDragging = false; };
        const onWheel = (e) => {
          if (stateRef.current.cameraMode !== 'free') return;
          camRadius = Math.max(300, Math.min(4500, camRadius + e.deltaY * 0.8));
        };

        const canvasDom = renderer.domElement;
        canvasDom.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        canvasDom.addEventListener('wheel', onWheel);

        // 애니메이션 루프
        let animId;
        let lastTime = performance.now();

        const animate = (time) => {
          const dt = Math.min((time - lastTime) / 1000, 0.1) || 0.016;
          lastTime = time;

          const s = stateRef.current;
          const pos = simPosRef.current;

          const simWaveSpeed = 280; // 화면 내 파동 전파 속도 (px/s)

          // 물리 이동 업데이트
          if (s.isPlaying) {
            // 속도 환산:
            // 은하 모드: v > 0 (멀어짐) 이면 은하가 관찰자(x=0)의 반대(+x 방향)로 이동!
            //           v < 0 (가까워짐) 이면 은하가 관찰자(x=0) 쪽(-x 방향)으로 이동!
            let vPx = 0;
            if (s.mode === 'galaxy') {
              vPx = (s.galaxySpeed / s.cSpeed) * simWaveSpeed;
            } else {
              vPx = (s.ambulanceSpeed / s.soundSpeed) * simWaveSpeed;
            }

            // 파원 위치 업데이트: (+)이면 x좌표 증가(멀어짐), (-)이면 x좌표 감소(가까워짐)
            pos.sourceX += vPx * dt;

            // 너무 멀어지거나 화면 밖으로 지나치게 벗어나면 자연스럽게 루프
            if (pos.sourceX > 2500) {
              pos.sourceX = 100;
            } else if (pos.sourceX < -1500) {
              pos.sourceX = 1800;
            }

            // 파면 방출 타이머 (초당 약 3.5개 방출)
            timeSinceLastWaveRef.current += dt;
            const emitInterval = 0.28;

            if (timeSinceLastWaveRef.current >= emitInterval) {
              timeSinceLastWaveRef.current %= emitInterval;

              // 기존의 아름다운 마루선 림 셰이더(Rim Shader) 생성:
              // 파원의 이동 방향에 따라 다가가는 쪽은 파란색(청색 편이), 멀어지는 쪽은 빨간색(적색 편이)
              const waveUniforms = {
                colorCyan: { value: new THREE.Color(0x38bdf8) },
                colorRed: { value: new THREE.Color(0xf43f5e) },
                colorBlue: { value: new THREE.Color(0x2563eb) },
                intensity: { value: Math.min(Math.abs(vPx) / simWaveSpeed, 1.0) },
                sourceDir: { value: vPx >= 0 ? 1.0 : -1.0 }, // 이동 방향 부호
                currentRadius: { value: 0.0 },
                maxRadius: { value: 2400.0 }
              };

              const mat = new THREE.ShaderMaterial({
                uniforms: waveUniforms,
                vertexShader: `
                  varying vec3 vNormal; varying vec3 vViewPosition; varying vec3 vPos;
                  void main() {
                    vPos = position;
                    vNormal = normalize(normalMatrix * normal);
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    vViewPosition = -mvPosition.xyz;
                    gl_Position = projectionMatrix * mvPosition;
                  }
                `,
                fragmentShader: `
                  uniform vec3 colorCyan; uniform vec3 colorRed; uniform vec3 colorBlue;
                  uniform float intensity; uniform float sourceDir;
                  uniform float currentRadius; uniform float maxRadius;
                  varying vec3 vNormal; varying vec3 vViewPosition; varying vec3 vPos;
                  void main() {
                    // 구면상의 x좌표 위치와 파원의 이동 방향을 비교하여 색상 결정
                    float t = vPos.x * sourceDir;
                    vec3 finalColor = colorCyan;
                    if (intensity > 0.02) {
                      if (t > 0.0) finalColor = mix(colorCyan, colorBlue, t * intensity);
                      else finalColor = mix(colorCyan, colorRed, -t * intensity);
                    }
                    vec3 normal = normalize(vNormal); vec3 viewDir = normalize(vViewPosition);
                    // 림 라이팅: 구면의 가장자리(접선)만 선명한 파면 마루선으로 표현!
                    float rim = smoothstep(0.72, 1.0, 1.0 - abs(dot(viewDir, normal)));
                    float distanceAlpha = max(0.0, 1.0 - (currentRadius / maxRadius));
                    gl_FragColor = vec4(finalColor, rim * distanceAlpha * 0.95);
                  }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
              });

              const waveMesh = new THREE.Mesh(baseSphereGeo, mat);
              waveMesh.position.set(pos.sourceX, 0, 0);
              scene.add(waveMesh);

              wavesRef.current.push({
                mesh: waveMesh,
                radius: 1,
                maxRadius: 2400,
                speed: simWaveSpeed
              });
            }

            // 기존 파면 확장 및 페이드아웃
            for (let i = wavesRef.current.length - 1; i >= 0; i--) {
              const w = wavesRef.current[i];
              w.radius += w.speed * dt;
              w.mesh.scale.set(w.radius, w.radius, w.radius);
              w.mesh.material.uniforms.currentRadius.value = w.radius;

              if (w.radius >= w.maxRadius) {
                scene.remove(w.mesh);
                w.mesh.geometry.dispose();
                w.mesh.material.dispose();
                wavesRef.current.splice(i, 1);
              }
            }
          }

          // 구체 3D 위치 동기화 (관찰자는 x=0 고정, 파원은 x=pos.sourceX)
          sourceMesh.position.set(pos.sourceX, 0, 0);
          obsMesh.position.set(pos.obsX, 0, 0);

          // 카메라 시점 업데이트
          const midX = (pos.sourceX + pos.obsX) / 2;
          if (s.cameraMode === 'observer') {
            camera.position.set(pos.obsX, 25, 45);
            camera.lookAt(pos.sourceX, 0, 0);
            camera.up.set(0, 1, 0);
          } else if (s.cameraMode === 'top') {
            camera.position.set(midX, 1600, 0);
            camera.lookAt(midX, 0, 0);
            camera.up.set(0, 0, -1);
          } else {
            camera.position.x = midX + camRadius * Math.sin(camPhi) * Math.cos(camTheta);
            camera.position.y = camRadius * Math.cos(camPhi);
            camera.position.z = camRadius * Math.sin(camPhi) * Math.sin(camTheta);
            camera.lookAt(midX, 0, 0);
            camera.up.set(0, 1, 0);
          }

            const vec = new THREE.Vector3();
            mesh.getWorldPosition(vec);
            vec.project(camera);
            const x = (vec.x * 0.5 + 0.5) * mountRef.current.clientWidth;
            const y = (vec.y * -0.5 + 0.5) * mountRef.current.clientHeight;

            if (vec.z > 1) {
              ref.current.style.opacity = '0';
            } else {
              ref.current.style.opacity = '1';
              ref.current.style.transform = `translate(-50%, -50%) translate(${x}px, ${y + offsetY}px)`;
            }
          };

          updateLabel(sourceLabelRef, sourceMesh, -38);
          updateLabel(obsLabelRef, obsMesh, 38);

          renderer.render(scene, camera);
          animId = requestAnimationFrame(animate);
        };

                        파원이나 관찰자가 시선 방향으로 상대 운동을 할 때, 단위 시간당 도달하는 파면의 개수가 달라집니다.
                        파원이 가까워지면 진동수가 증가(f' &gt; f₀)하고, 멀어지면 진동수가 감소(f' &lt; f₀)합니다.
                      </p>
                      <div className="bg-slate-900 p-3 rounded-lg border border-slate-800 text-center font-mono text-sm text-cyan-300 font-bold mt-2 flex items-center justify-center flex-wrap gap-2">
                        <span>f' = f₀ × (<Frac top="c" bot="c + v" />)</span>
                        <span className="text-xs text-slate-400 font-normal">(+ 후퇴 시 f' 감소, - 접근 시 f' 증가)</span>
                      </div>
                    </div>
                  )}

                  {formulaStep === 3 && (
                    <div className="space-y-2 animate-fadeIn">
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-800 text-xs font-bold">
                          3단계
                        </span>
                        <h4 className="text-sm font-bold text-white">진동수를 파장으로 변환 (f = c/λ, f' = c/λ')</h4>
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed">
                        천문학에서는 빛의 진동수보다 망원경 분광기로 직접 측정하는 <strong>스펙트럼의 파장(λ)</strong>을 주로 다룹니다.
                        f = c/λ 관계를 대입하여 정리하면 관측 파장 λ'을 얻을 수 있습니다.
                      </p>
                      <div className="bg-slate-900 p-3 rounded-lg border border-slate-800 text-center font-mono text-sm text-cyan-300 font-bold mt-2 flex items-center justify-center flex-wrap gap-2">
                        <span><Frac top="c" bot="λ'" /> = <Frac top="c" bot="λ₀" /> × (<Frac top="c" bot="c + v" />)</span>
                        <span className="text-slate-400">⟹</span>
                        <span>λ' = λ₀ × (1 + <Frac top="v" bot="c" />)</span>
                        <span className="text-xs text-slate-400 font-normal ml-2">(v ≪ c 일 때)</span>
                      </div>
                    </div>
                  )}

                  {formulaStep === 4 && (
                    <div className="space-y-2 animate-fadeIn">
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-800 text-xs font-bold">
                          4단계
                        </span>
                        <h4 className="text-sm font-bold text-white">파장의 변화량 (Δλ)과 편이 방향</h4>
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed">
                        관측된 파장(λ')에서 원래의 고유 파장(λ₀)을 뺀 값을 <strong>파장의 변화량(Δλ)</strong>이라고 합니다.
                      </p>
                      <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 text-center font-mono text-sm text-cyan-300 font-bold">
                        Δλ = λ' - λ₀ = λ₀ × (<Frac top="v" bot="c" />)
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                        <div className="bg-rose-950/40 border border-rose-800/80 p-2.5 rounded-lg text-xs">
                          <p className="font-bold text-rose-300 mb-1">🔴 적색 편이 (Redshift)</p>
                          <p className="text-slate-300 text-[11px]">은하가 멀어질 때 (v &gt; 0) ⟹ Δλ &gt; 0 (파장이 길어져 붉은색 쪽으로 이동)</p>
                        </div>
                        <div className="bg-blue-950/40 border border-blue-800/80 p-2.5 rounded-lg text-xs">
                          <p className="font-bold text-blue-300 mb-1">🔵 청색 편이 (Blueshift)</p>
                          <p className="text-slate-300 text-[11px]">은하가 가까워질 때 (v &lt; 0) ⟹ Δλ &lt; 0 (파장이 짧아져 푸른색 쪽으로 이동)</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {formulaStep === 5 && (
                    <div className="space-y-2 animate-fadeIn">
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800 text-xs font-bold">
                          5단계 (최종)
                        </span>
                        <h4 className="text-sm font-bold text-white">고등학교 지구과학 I 핵심 공식 (허블-르메트르 법칙 기반)</h4>
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed">
                        적색편이량 z는 원래 파장에 대한 파장 변화량의 비율이며, 비상대론적 근사에서 은하의 후퇴 속도(v)와 광속(c)의 비와 같습니다.
                      </p>
                      <div className="bg-gradient-to-r from-cyan-950/60 to-blue-950/60 border border-cyan-800 p-3 rounded-lg text-center font-mono text-base font-bold text-cyan-200 mt-2 flex flex-col items-center justify-center gap-2">
                        <div className="flex items-center justify-center flex-wrap gap-2 text-lg">
                          <span>z = <Frac top="Δλ" bot="λ₀" /> = <Frac top="λ' - λ₀" bot="λ₀" /> = <Frac top="v" bot="c" /></span>
                        </div>
                        <div className="text-xs font-normal text-amber-300">
                          ∴ 후퇴 속도 v = c × <Frac top="Δλ" bot="λ₀" /> = c × z
                        </div>
                      </div>
                      <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 text-[11px] font-mono text-slate-300 mt-2 flex flex-wrap justify-between items-center gap-2">
                        <span className="text-slate-400">현재 값 대입:</span>
                        <span>Δλ = {mode === 'galaxy' ? `${calc.deltaLambda.toFixed(2)} nm` : `${calc.deltaLambda.toFixed(3)} m`}</span>
                        <span>λ₀ = {mode === 'galaxy' ? `${calc.lambda0} nm` : `${calc.lambda0.toFixed(3)} m`}</span>
                        <span className="text-cyan-400 font-bold">z = {calc.z.toFixed(4)}</span>
                        <span className="text-amber-400 font-bold">v = {mode === 'galaxy' ? `${calc.vRel.toLocaleString()} km/s` : `${calc.vRel} m/s`}</span>
                      </div>
                    </div>
                  )}

                </div>
              </div>

            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DopplerSimulationApp />);
  </script>
</body>
</html>
